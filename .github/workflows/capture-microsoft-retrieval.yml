name: Capture Microsoft retrieval challenge screenshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-microsoft-retrieval.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture the expanded challenge
        run: |
          mkdir -p survey/assets
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 2048, height: 1323 },
              deviceScaleFactor: 1
            });

            await page.goto(
              'https://www.microsoft.com/en-us/research/academic-program/microsoft-research-fellowship/research-challenges/',
              { waitUntil: 'networkidle', timeout: 120000 }
            );

            const challenge = page.getByRole('button', {
              name: /Efficient and accurate post-training of retrieval models/
            }).first();

            await challenge.scrollIntoViewIfNeeded();
            const expanded = await challenge.getAttribute('aria-expanded');
            if (expanded !== 'true') {
              await challenge.click();
            }
            await page.waitForTimeout(1200);

            await challenge.evaluate((element) => {
              const y = element.getBoundingClientRect().top + window.scrollY - 150;
              window.scrollTo(0, Math.max(0, y));
            });
            await page.waitForTimeout(500);

            await page.screenshot({
              path: 'survey/assets/microsoft-retrieval-post-training.png',
              fullPage: false
            });
            await browser.close();
          })();
          NODE

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add survey/assets/microsoft-retrieval-post-training.png
          git commit -m "Add Microsoft retrieval challenge source screenshot"
          git push
