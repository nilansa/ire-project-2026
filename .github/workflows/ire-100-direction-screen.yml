name: IRE 100-direction empirical screen

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/100-direction-screen-20260928
    paths:
      - .github/workflows/ire-100-direction-screen.yml

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct and correct Cranfield loader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/100-direction-screen
          cat experiments/100-direction-screen/payload/part*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > experiments/100-direction-screen/ire_100_direction_screen.py
          echo "67feb32a0b86c4f32d4fecb96a1a74e65ba99a0d366a138f94be324f103850c7  experiments/100-direction-screen/ire_100_direction_screen.py" | sha256sum --check

          python - <<'PY'
          from pathlib import Path

          path = Path("experiments/100-direction-screen/ire_100_direction_screen.py")
          text = path.read_text()
          start = text.index("def load_cranfield(cache: Path) -> IRDataset:")
          end = text.index("\ndef load_scifact(cache: Path) -> IRDataset:")
          fixed = r'''def load_cranfield(cache: Path) -> IRDataset:
              base = "https://raw.githubusercontent.com/oussbenk/cranfield-trec-dataset/main"
              docs_p = download(f"{base}/cran.all.1400.xml", cache / "cranfield" / "docs.xml")
              q_p = download(f"{base}/cran.qry.xml", cache / "cranfield" / "queries.xml")
              r_p = download(f"{base}/cranqrel.trec.txt", cache / "cranfield" / "qrels.txt")

              docs_raw = docs_p.read_text(encoding="utf-8", errors="replace")
              doc_blocks = re.findall(r"<doc>(.*?)</doc>", docs_raw, flags=re.I | re.S)
              doc_ids, titles, texts = [], [], []
              for b in doc_blocks:
                  did = _tag(b, "docno")
                  title = _tag(b, "title")
                  body = _tag(b, "text")
                  if did:
                      doc_ids.append(did)
                      titles.append(title)
                      texts.append((title + " " + body).strip())

              queries_raw = q_p.read_text(encoding="utf-8", errors="replace")
              q_blocks = re.findall(r"<top>(.*?)</top>", queries_raw, flags=re.I | re.S)
              query_ids, query_texts = [], []
              for b in q_blocks:
                  qid = _tag(b, "num")
                  qtext = _tag(b, "title")
                  if qid:
                      query_ids.append(qid)
                      query_texts.append(qtext)

              did_to_i = {x: i for i, x in enumerate(doc_ids)}
              # Qrels topic t denotes the t-th query record, not sparse XML <num>.
              if len(query_ids) != 225:
                  raise ValueError(f"Expected 225 Cranfield query records, found {len(query_ids)}")
              qrels: dict[int, set[int]] = defaultdict(set)
              seen_topics: set[int] = set()
              for line in r_p.read_text(encoding="utf-8", errors="replace").splitlines():
                  fields = line.split()
                  if len(fields) < 4 or fields[2] not in did_to_i:
                      continue
                  try:
                      topic = int(fields[0])
                      rel = float(fields[3])
                  except ValueError:
                      continue
                  qi = topic - 1
                  if not (0 <= qi < len(query_ids)):
                      raise ValueError(f"Out-of-range Cranfield qrels topic: {topic}")
                  seen_topics.add(topic)
                  if rel > 0:
                      qrels[qi].add(did_to_i[fields[2]])
              if seen_topics != set(range(1, 226)) or any(not qrels.get(i) for i in range(225)):
                  raise ValueError("Cranfield qrels did not align to all 225 query records")
              return IRDataset(
                  name="cranfield",
                  doc_ids=doc_ids,
                  doc_titles=titles,
                  doc_texts=texts,
                  query_ids=query_ids,
                  query_texts=query_texts,
                  qrels={i: qrels[i] for i in range(225)},
              )
          '''
          # Remove the workflow's indentation from the embedded function.
          fixed = "\n".join(line[10:] if line.startswith("          ") else line for line in fixed.splitlines()) + "\n"
          path.write_text(text[:start] + fixed + text[end:])
          PY
          python -m py_compile experiments/100-direction-screen/ire_100_direction_screen.py

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: \
            numpy==1.26.4 pandas==2.2.3 scipy==1.13.1 scikit-learn==1.5.2

      - name: Run all 100 directions on two datasets and three splits
        run: |
          rm -rf experiments/100-direction-screen/results
          python experiments/100-direction-screen/ire_100_direction_screen.py \
            --output experiments/100-direction-screen/results \
            --cache .cache/ire-100-direction-screen \
            --datasets cranfield scifact \
            --seeds 0 1 2 \
            --budget 12

      - name: Upload complete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ire-100-direction-screen-results-corrected-v2
          path: |
            experiments/100-direction-screen/ire_100_direction_screen.py
            experiments/100-direction-screen/results
          if-no-files-found: warn
          retention-days: 30

      - name: Commit reproducible source and successful results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/100-direction-screen/ire_100_direction_screen.py \
                  experiments/100-direction-screen/results
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Correct Cranfield alignment and rerun 100-direction screen"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
